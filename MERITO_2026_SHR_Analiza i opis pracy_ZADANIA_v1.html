<script>
// ===================== APLIKACJA (praca grup bez bazy) =====================
const URLP = new URLSearchParams(location.search);
const PROW = URLP.get('prowadzacy') === '1';
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('aria-')) { e.setAttribute(k, String(v)); continue; }
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const getP = (o, path) => path.reduce((a, k) => (a == null ? undefined : a[k]), o);
const nest = (path, v) => path.reduceRight((acc, k) => ({ [k]: acc }), v);
const norm = s => (s || '').toLowerCase().replace(/\s+/g, ' ').replace(/\bds\.\s*/g, 'ds. ').trim();
const klucz = nr => KLUCZ.find(k => k[0] === nr);
const merge = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) a[k] = merge(a[k] && typeof a[k] === 'object' ? a[k] : {}, b[k]); else a[k] = b[k]; } return a; };

// ---------- Zapis w przeglądarce ----------
const KL = 'zml-ap-zadania-';
let PAMIEC_OK = true;
const mem = {};
function wczytajGrupe(g) {
  if (mem[g]) return mem[g];
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KL + g) || '{}'); } catch (e) { PAMIEC_OK = false; }
  mem[g] = d.docs ? d : { docs: {} };
  return mem[g];
}
function zapiszGrupe(g) {
  try { localStorage.setItem(KL + g, JSON.stringify(mem[g])); PAMIEC_OK = true; } catch (e) { PAMIEC_OK = false; }
}
const DB = {
  subs: [],
  get(id) { const g = id.split('_')[0]; return wczytajGrupe(g).docs[id] || {}; },
  watchDoc(id, cb) { const s = { id, cb }; this.subs.push(s); setTimeout(() => cb(structuredClone(this.get(id))), 0); return () => { this.subs = this.subs.filter(x => x !== s); }; },
  save(id, patch) {
    const g = id.split('_')[0], G0 = wczytajGrupe(g);
    G0.docs[id] = merge(structuredClone(G0.docs[id] || {}), patch);
    G0.zmieniono = Date.now();
    zapiszGrupe(g);
    const d = G0.docs[id];
    setTimeout(() => this.subs.forEach(s => { if (s.id === id) s.cb(structuredClone(d)); }), 0);
  }
};

// ---------- Stan ----------
const TAB_KEYS = ['start', 'nazwy', 'ekasp', 'wzor', 'zadania', 'opis', 'zestawienia'];
const ST = { grupa: '', tab: TAB_KEYS.includes(URLP.get('zadanie')) ? URLP.get('zadanie') : 'start', unsub: [] };
try { const g = localStorage.getItem(KL + 'wybrana'); if (GRUPY.includes(g)) ST.grupa = g; } catch (e) {}
if (GRUPY.includes(URLP.get('grupa'))) ST.grupa = URLP.get('grupa');
const G = () => ST.grupa;
let statusTimer;
function status(kind, txt) {
  const el = $('#status'); if (!el) return;
  if (kind === 'ok') { el.textContent = PAMIEC_OK ? 'Zapisano w przeglądarce' : 'Przeglądarka nie zapisuje danych — zapiszcie plik grupy'; el.className = 'status ' + (PAMIEC_OK ? 'ok' : 'err'); clearTimeout(statusTimer); if (PAMIEC_OK) statusTimer = setTimeout(() => { el.textContent = ''; }, 2500); }
  else { el.textContent = txt || ''; el.className = 'status ' + (kind === 'err' ? 'err' : 'ok'); clearTimeout(statusTimer); statusTimer = setTimeout(() => { el.textContent = ''; }, 5000); }
}
function save(docId, typ, path, value, extra = {}) {
  DB.save(docId, { typ, grupa: G(), ts: Date.now(), ...extra, ...nest(path, value) });
  status('ok');
}
const timers = {};
function saveLater(key, fn) { clearTimeout(timers[key]); timers[key] = setTimeout(fn, 400); }

// ---------- Plik grupy ----------
function stempel() { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()); }
function pobierzPlik() {
  const g = G(), dane = { format: 'zml-analiza-pracy-grupa', wersja: 1, grupa: g, zapisano: new Date().toISOString(), docs: wczytajGrupe(g).docs };
  const blob = new Blob([JSON.stringify(dane, null, 1)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: 'MERITO_2026_Analiza pracy_' + g + '_' + stempel() + '.json' });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  status('info', 'Plik grupy ' + g + ' zapisany w Pobranych. Wrzućcie go na czat grupy w Teams.');
}
function czytajPlik(file) {
  return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (d.format !== 'zml-analiza-pracy-grupa' || !GRUPY.includes(d.grupa) || !d.docs) throw new Error('format'); ok(d); } catch (e) { bad(e); } }; r.onerror = bad; r.readAsText(file); });
}
function wczytajPlik() {
  const inp = h('input', { type: 'file', accept: '.json,application/json' });
  inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const d = await czytajPlik(f);
      mem[d.grupa] = { docs: d.docs, zmieniono: Date.now() }; zapiszGrupe(d.grupa);
      ST.grupa = d.grupa; try { localStorage.setItem(KL + 'wybrana', d.grupa); } catch (e) {}
      render(); status('info', 'Wczytano plik grupy ' + d.grupa + ' (zapisany ' + new Date(d.zapisano).toLocaleString('pl-PL') + ').');
    } catch (e) { status('err', 'To nie jest plik grupy z tych zajęć.'); }
  });
  inp.click();
}
function przypomnienie() {
  return h('div', { class: 'card przyp' }, h('b', {}, 'Na koniec ćwiczenia'),
    h('p', { class: 'desc' }, 'Zapiszcie plik grupy i wrzućcie go na czat grupy w Teams. Jeśli zmienia się osoba, która wpisuje, nowa osoba wczytuje ten plik i pracuje dalej od tego samego miejsca.'),
    h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', onclick: pobierzPlik }, 'Zapisz plik grupy')));
}

// Pola powiązane z dokumentem: data-p = ścieżka w dokumencie
function bindText(el, docId, typ, path, extra) {
  el.dataset.p = path.join('.');
  el.addEventListener('input', () => saveLater(docId + el.dataset.p, () => save(docId, typ, path, el.value, extra)));
  return el;
}
function bindSelect(el, docId, typ, path, extra, after) {
  el.dataset.p = path.join('.');
  el.addEventListener('change', () => { save(docId, typ, path, el.value, extra); if (after) after(el.value); });
  return el;
}
function chip(label, docId, typ, path, extra) {
  const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': 'false', 'data-p': path.join('.'), 'data-k': 'chip' }, label);
  b.addEventListener('click', () => { const v = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', v); save(docId, typ, path, v, extra); });
  return b;
}
function scale(docId, typ, path, extra, onPick) {
  const box = h('div', { class: 'scale', 'data-p': path.join('.'), 'data-k': 'scale' });
  for (let n = 1; n <= 7; n++) {
    const b = h('button', { class: 'chip sq', type: 'button', 'aria-pressed': 'false', title: SKALA_W[n] }, String(n));
    b.addEventListener('click', () => { box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); save(docId, typ, path, n, extra); if (onPick) onPick(n); });
    box.append(b);
  }
  return box;
}
function applyDoc(root, data) {
  root.querySelectorAll('[data-p]').forEach(el => {

    const W = ekaspWyniki(dE);
    const top = EKASP.map((e, i) => [e, W[i]]).filter(([, x]) => x.final !== null && x.final >= 5);
    live.psych.textContent = top.length ? 'Wynik konsensusu EKASP Waszej grupy — pozycje z wagą 5 lub wyższą: ' + top.map(([e, x]) => e[1].replace(/\.$/, '') + ' (' + pl(x.final) + ')').join('; ') + '.' : 'Wyniki konsensusu EKASP Waszej grupy pojawią się tu po wystawieniu ocen w zakładce EKASP.';
  }));
}

// ---------- ZAKŁADKA: ZESTAWIENIA ----------
function tbl(head, rows) {
  return h('div', { class: 'tw' }, h('table', {}, h('thead', {}, h('tr', {}, head.map(x => h('th', {}, x)))),
    h('tbody', {}, rows.length ? rows.map(r => h('tr', {}, r.map(c => h('td', {}, c)))) : h('tr', {}, h('td', { colspan: head.length, class: 'muted' }, 'Brak danych w opisach.')))));
}
const PLIKI = {};
async function tabZestawienia(main) {
  main.append(intro(
    'Zestawienia powstają z opisów wypełnionych przez wszystkie grupy. Wczytajcie pliki grup (można zaznaczyć kilka naraz). Opisy zapisane w jednym wzorze, z wartościami wybieranymi ze słowników, działają jak baza danych: jedno zestawienie odpowiada na pytanie, które bez takiej bazy wymagałoby przeczytania wszystkich opisów.',
    'Liczba osób pochodzi z obsady stanowisk w firmie KORVEX, dlatego zestawienia pokazują od razu skalę działań, np. ile osób trzeba przeszkolić albo ile kont w systemie założyć.'));
  const info = h('p', { class: 'muted' });
  const inp = h('input', { type: 'file', accept: '.json,application/json', multiple: true, hidden: true });
  inp.addEventListener('change', async () => {
    let n = 0, bad = 0;
    for (const f of inp.files) { try { const d = await czytajPlik(f); PLIKI[d.grupa] = d.docs; n++; } catch (e) { bad++; } }
    inp.value = ''; run(); status(bad ? 'err' : 'info', 'Wczytane pliki: ' + n + (bad ? '; pominięte (zły format): ' + bad : '') + '.');
  });
  main.append(inp, h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', onclick: () => inp.click() }, 'Wczytaj pliki grup'), h('button', { class: 'btn', type: 'button', onclick: () => run() }, 'Odśwież zestawienia')), info);
  const out = h('div', {});
  const btn = h('button', { class: 'btn', type: 'button', onclick: () => run() }, 'Odśwież zestawienia');
  main.append(h('div', { class: 'actions' }, btn), out);
  async function run() {
    out.replaceChildren(h('p', { class: 'muted' }, 'Wczytywanie opisów…'));
    const zrodla = {};
    GRUPY.forEach(g => { const loc = wczytajGrupe(g).docs; if (Object.keys(loc).length) zrodla[g] = loc; });
    Object.assign(zrodla, PLIKI);
    info.textContent = 'Dane grup: ' + (Object.keys(zrodla).sort().join(', ') || 'brak') + '.';
    const docs = Object.values(zrodla).flatMap(d => Object.values(d));
    let opisy = docs.filter(d => d.typ === 'opis'), zad = docs.filter(d => d.typ === 'zadania');
    opisy = opisy.filter(o => o.pola && o.pola.numer).sort((a, b) => (a.grupa || '').localeCompare(b.grupa || ''));
    const S = opisy.map(o => { const k = klucz(o.pola.numer); const t = o.pola.typ || (k && k[2]); return { o, k, nr: o.pola.numer, n: o.pola.nazwa || (k && k[1]), t, w: WZOR_TYPU[t] || 'S', os: k ? k[4] : 1 }; });
    const has = (s, f, i) => getP(s.o, ['pola', f, 'o' + i]) === true;
    const lab = s => s.nr + ' ' + s.n;
    const sec = (t, p, el) => h('section', { class: 'mod' }, h('h2', {}, t), h('p', { class: 'muted' }, p), el);
    const byOption = (f, idxs) => idxs.map(i => { const st = S.filter(s => has(s, f, i)); return [L[f][i], st.map(lab).join('; ') || '—', String(st.reduce((a, s) => a + s.os, 0))]; });
    const all = n => [...Array(L[n].length).keys()];
    out.replaceChildren(
      sec('1. Przegląd opisów', 'Każdy wiersz to jeden rekord bazy: jedno stanowisko, niezależnie od liczby osób, które je zajmują.',
        tbl(['Grupa', 'Stanowisko', 'Typ', 'Wzór', 'Osoby', 'Wypełnienie'], S.map(s => [s.o.grupa, lab(s), s.t || '—', s.w, String(s.os), wypelnienie(s.o, s.w) + '%']))),
      sec('2. Dostęp do danych osobowych', 'Lista upoważnień do przetwarzania danych osobowych powstaje z jednego pola opisu, bez osobnego rejestru.',
        tbl(['Upoważnienie', 'Stanowiska', 'Osoby'], byOption('dostep', [7, 8]))),
      sec('3. Systemy informatyczne', 'Zestawienie dostępów do systemów jest podstawą planu licencji i nadawania uprawnień przez IT.',
        tbl(['System', 'Stanowiska', 'Osoby (konta)'], byOption('dostep', [0, 1, 2, 3, 4, 5, 6, 9]))),
      sec('4. Ryzyka, środki ochrony i badania', 'Służba BHP widzi w jednym miejscu, które stanowiska wymagają których środków ochrony i badań.',
        tbl(['Stanowisko', 'Ryzyka i środki ochrony', 'Badania', 'Osoby'], S.map(s => [lab(s), L.ryzyka.filter((_, i) => has(s, 'ryzyka', i)).join('; ') || '—', L.badania.filter((_, i) => has(s, 'badania', i)).join('; ') || '—', String(s.os)]))),
      sec('5. Szkolenia obowiązkowe', 'Plan szkoleń obowiązkowych z liczbą osób do przeszkolenia wynika bezpośrednio z opisów.',
        tbl(['Szkolenie', 'Stanowiska', 'Osoby'], byOption('szkolenia', all('szkolenia')))),
      sec('6. Uprawnienia zawodowe', 'Rejestr wymaganych uprawnień pozwala pilnować terminów ich ważności.',
        tbl(['Uprawnienie', 'Stanowiska', 'Osoby'], byOption('uprawnienia', all('uprawnienia').slice(1)))),
      sec('7. Kompetencje', 'Częstość kompetencji w opisach wskazuje, które programy rozwojowe obejmą najwięcej osób.',
        tbl(['Kompetencja', 'Stanowiska', 'Osoby'], KOMPETENCJE.map(x => { const st = S.filter(s => Object.values(getP(s.o, ['pola', 'komp']) || {}).some(v => !v.del && v.k === x[0])); return [x[0], st.map(lab).join('; ') || '—', String(st.reduce((a, s) => a + s.os, 0))]; }))),
      sec('8. Pola wzorcowe', 'Pola wzorcowe mają jednakową treść we wszystkich opisach danego wzoru. Zmiana przepisu wymaga poprawienia jednego wpisu we wzorze, a nie każdego opisu osobno.',
        tbl(['Pole', 'Wzór', 'Liczba opisów z tą samą treścią'], POLA.filter(p => p[7] === 'wzor' || p[7] === 'typowe').flatMap(p => (p[3] === 'M' ? ['M'] : ['S', 'M']).map(w => [p[2], w, String(S.filter(s => s.w === w).length)])))),
      sec('9. Zadania typowe i zadania własne stanowiska', 'Porównanie pokazuje, w jakiej części opis powstaje hurtowo z wzoru, a w jakiej wymaga pracy SME.',
        tbl(['Stanowisko', 'Zadania typowe', 'Zadania własne'], S.map(s => { const z = zad.find(d => d.grupa === s.o.grupa); const nw = z ? Object.values(z.z || {}).filter(v => !v.del && (v.D || '').trim()).length : 0;
          return [lab(s), String(s.k ? typowe(s.nr).length : 0), String(nw)]; }))),
      sec('10. Cykl przeglądu', 'Cykl przeglądu i data następnego przeglądu pozwalają zaplanować, które opisy trzeba przejrzeć w najbliższym czasie, i przygotować pracę zespołów SME.',
        tbl(['Stanowisko', 'Cykl przeglądu', 'Data następnego przeglądu', 'Osoby'], S.map(s => [lab(s), getP(s.o, ['pola', 'cykl']) || '—', getP(s.o, ['pola', 'nastepny']) || '—', String(s.os)])))
    );
  }
  run();
}

// ---------- Ramy aplikacji ----------
const TABS = [['start', 'Wszystkie zadania', tabStart], ['nazwy', '1. Nazwy', tabNazwy], ['ekasp', '2. EKASP', tabEkasp], ['wzor', '3. Wzór i właściciele', tabWzor], ['zadania', '4. Zadania', tabZadania], ['opis', '5. Opis', tabOpis], ['zestawienia', 'Zestawienia', tabZestawienia]];
const OPISY_ZAD = {
  nazwy: 'Porządkowanie nazw stanowisk w działach Waszej grupy według reguły poziom + zakres.',
  ekasp: 'Ocena dziesięciu pozycji EKASP dla Waszego stanowiska i procedura konsensusu.',
  wzor: 'Właściciele wszystkich pól wzoru opisu: kto wypełnia które pole.',
  zadania: 'Zadania własne Waszego stanowiska w układzie DZIK.',
  opis: 'Pełny opis Waszego stanowiska, z wynikami poprzednich zadań.'
};
function adres(zad, g) { const u = new URL(location.href); u.search = ''; u.searchParams.set('zadanie', zad); if (g) u.searchParams.set('grupa', g); return u.toString(); }
function tabStart(main) {
  main.append(h('h1', {}, 'Praca w grupach — zadania'),
    intro('Pracuje jedna osoba w grupie, protokolant, który udostępnia ekran w pokoju grupy. Wszystko, co wpisuje, zapisuje się w jego przeglądarce, a po każdym zadaniu grupa zapisuje plik grupy i wrzuca go na czat grupy w Teams.',
      'Jeśli protokolant się zmienia, nowa osoba otwiera tę stronę, klika „Wczytaj plik grupy” i wybiera ostatni plik z czatu.'),
    stanowiskoInfo(STANOWISKO_GRUPY[G()]));
  const list = h('div', { class: 'tiles' });
  ['nazwy', 'ekasp', 'wzor', 'zadania', 'opis'].forEach((k, n) => list.append(h('a', { class: 'tile', href: adres(k, G()) }, h('span', { class: 'tile-n' }, String(n + 1)), h('b', {}, TABS.find(t => t[0] === k)[1].replace(/^\d\. /, '')), h('span', {}, OPISY_ZAD[k]))));
  main.append(list, h('h2', {}, 'Plik grupy'), h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', onclick: pobierzPlik }, 'Zapisz plik grupy'), h('button', { class: 'btn', type: 'button', onclick: wczytajPlik }, 'Wczytaj plik grupy')));
}
function wyborGrupy(main) {
  main.append(h('div', { class: 'card narrow' }, h('h2', {}, 'Wybierzcie swoją grupę'),
    h('p', { class: 'muted' }, 'Numer grupy podaje prowadzący. Wybór można zmienić w każdej chwili przyciskiem „Zmień grupę”.'),
    h('div', { class: 'grupy' }, GRUPY.map(g => h('button', { class: 'btn', type: 'button', onclick: () => { ST.grupa = g; try { localStorage.setItem(KL + 'wybrana', g); } catch (e) {} render(); } }, 'Grupa ' + g.slice(1)))),
    h('p', { class: 'muted' }, 'Macie już plik grupy z czatu? ', h('a', { href: '#', class: 'link', onclick: e => { e.preventDefault(); wczytajPlik(); } }, 'Wczytaj plik grupy'))));
}
function render() {
  ST.unsub.forEach(u => { try { u(); } catch (e) {} }); ST.unsub = [];
  const main = $('#main'); main.replaceChildren();
  const bez = !G() && ST.tab !== 'zestawienia';
  $('#tabs').replaceChildren(...(bez ? [] : TABS.map(([k, n]) => h('button', { class: 'chip', type: 'button', 'aria-pressed': ST.tab === k, onclick: () => { ST.tab = k; try { history.replaceState(null, '', adres(k, G())); } catch (e) {} render(); } }, n))));
  $('#who').textContent = G() ? 'Grupa ' + G().slice(1) + ' · ' + klucz(STANOWISKO_GRUPY[G()]).slice(0, 2).join(' ') : '';
  $('#change').hidden = !G();
  $('#plik').hidden = !G();
  if (bez) wyborGrupy(main); else TABS.find(t => t[0] === ST.tab)[2](main);
  window.scrollTo(0, 0);
}
$('#change').addEventListener('click', () => { ST.grupa = ''; try { localStorage.removeItem(KL + 'wybrana'); } catch (e) {} render(); });
$('#plik').addEventListener('click', pobierzPlik);
try { localStorage.setItem(KL + 'test', '1'); localStorage.removeItem(KL + 'test'); } catch (e) { PAMIEC_OK = false; }
render();
if (!PAMIEC_OK) status('err', 'Przeglądarka nie zapisuje danych (np. tryb prywatny) — zapisujcie plik grupy po każdym zadaniu.');

</script>
