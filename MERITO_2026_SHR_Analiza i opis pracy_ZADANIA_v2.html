<style>
:root {
  --bg: #F5F5F7; --surface: #FFFFFF; --fg: #1F2B36; --head: #1F4460; --muted: #61788C; --line: #D9E1E8;
  --navy: #1F4460; --honey: #E8B62C; --gold-bg: #FBF0CF; --gold-fg: #5C4810; --red: #C8202E; --green: #2E6B4A;
  --info: #F0F6FB; --chip: #EAF0F5; --chip-on: #1F4460; --chip-on-fg: #FFFFFF; --locked: #F0F6FB;
  --btn-bg: #1F4460; --btn-fg: #FFFFFF; --btn-hover: #163450;
  --font: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif; --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1B26; --surface: #162836; --fg: #E6EDF3; --head: #E6EDF3; --muted: #9BB0C2; --line: #263E51;
  --info: #1D3446; --chip: #1D3446; --chip-on: #E8B62C; --chip-on-fg: #1F2B36; --locked: #1D3446; --gold-bg: #3A3218; --gold-fg: #F3D27A; --green: #7FC8A0; --red: #FF8A8A;
  --btn-bg: #E8B62C; --btn-fg: #1F2B36; --btn-hover: #B68C20; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1B26; --surface: #162836; --fg: #E6EDF3; --head: #E6EDF3; --muted: #9BB0C2; --line: #263E51;
  --info: #1D3446; --chip: #1D3446; --chip-on: #E8B62C; --chip-on-fg: #1F2B36; --locked: #1D3446; --gold-bg: #3A3218; --gold-fg: #F3D27A; --green: #7FC8A0; --red: #FF8A8A;
  --btn-bg: #E8B62C; --btn-fg: #1F2B36; --btn-hover: #B68C20; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5 }
.brand { background: var(--navy); color: var(--honey); padding: 12px 20px; font-weight: 800; letter-spacing: .2em; font-size: 12px; text-transform: uppercase; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between }
.brand .who { color: #FFFFFF; letter-spacing: .04em; text-transform: none; font-weight: 600 }
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
.topin { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between }
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 64px }
h1 { color: var(--head); font-size: clamp(22px, 3vw, 30px); margin: 0 0 6px }
h2 { color: var(--head); font-size: 18px; margin: 22px 0 10px }
.seg, .chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font: 600 13px var(--font); color: var(--fg); background: var(--chip); border: 0; border-radius: 999px; padding: 7px 13px; cursor: pointer; text-align: left }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-fg) }
.chip.sq { min-width: 40px; text-align: center; border-radius: 10px; font-size: 15px; padding: 8px 0 }
.btn { font: 700 14px var(--font); background: var(--btn-bg); color: var(--btn-fg); border: 0; border-radius: 999px; padding: 10px 22px; min-height: 42px; min-width: 150px; cursor: pointer }
.btn:hover { background: var(--btn-hover) }
.chip:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px }
.status { font-size: 13px; color: var(--muted); min-height: 1em }
.status.ok { color: var(--green) } .status.err { color: var(--red); font-weight: 700 }
.intro { background: var(--info); border-left: 4px solid var(--navy); border-radius: 0 10px 10px 0; padding: 12px 16px; margin: 0 0 14px }
.intro p { margin: 0 0 8px } .intro p:last-child { margin: 0 }
.list { display: flex; flex-direction: column; gap: 12px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.card.narrow { max-width: 480px; margin: 40px auto }
.row-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center }
.row-h b { color: var(--head) }
.tag { align-self: flex-start; font-size: 12px; font-weight: 700; background: var(--chip); color: var(--muted); border-radius: 6px; padding: 2px 8px }
.tag.soft { background: transparent; border: 1px solid var(--line) }
.tag.gold { background: var(--gold-bg); color: var(--gold-fg) }
.desc { margin: 0 }
.muted { color: var(--muted); font-size: 14px; margin: 0 }
label { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
label > span, .lbl { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em }
input[type=text], input[type=number], select, textarea { font: 500 15px var(--font); color: var(--fg); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0 }
textarea { resize: vertical }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 14px; align-items: end }
@media (max-width: 640px) { .grid2 { grid-template-columns: minmax(0, 1fr) } .btn { min-width: 0 } }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 12px }
.actions.end { justify-content: flex-end; margin: 0 }
.key { border-top: 1px dashed var(--line); padding-top: 8px; font-size: 14px; display: flex; flex-direction: column; gap: 4px }
.ok { color: var(--green); font-weight: 700 } .no { color: var(--red); font-weight: 700 }
.scale { display: flex; flex-wrap: wrap; gap: 6px }
.vals { font-variant-numeric: tabular-nums; font-size: 14px }
.r2 { display: flex; flex-direction: column; gap: 6px; border-top: 1px dashed var(--line); padding-top: 8px }
.stan { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; margin-bottom: 8px }
.stan-nr { background: var(--navy); color: var(--honey); font-weight: 800; border-radius: 8px; padding: 6px 10px; font-variant-numeric: tabular-nums }
.stan-n { font-weight: 800; color: var(--head); font-size: 17px }
.mod { margin-top: 8px }
.locked { background: var(--locked); border-radius: 8px; padding: 10px 14px 10px 30px; margin: 0; font-size: 14px }
p.locked { padding-left: 14px }
.locked li + li { margin-top: 6px }
.psych { display: flex; flex-direction: column; gap: 6px }
.pline { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 10px; align-items: center; font-size: 14px }
.pline > span { font-size: 14px; font-weight: 500; color: var(--fg); letter-spacing: 0 }
.komp { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px }
.prowbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 14px; background: var(--gold-bg); border-radius: 10px; padding: 10px 14px }
.link { color: var(--head); font-weight: 700 }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface) }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th { text-align: left; background: var(--navy); color: #FFFFFF; padding: 8px 10px; font-weight: 700; white-space: nowrap }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 6px 0 10px }
.tile { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--navy); border-radius: var(--r); padding: 14px 16px }
.tile:hover { border-color: var(--honey) }
.tile b { color: var(--head); font-size: 17px }
.tile span { font-size: 14px; color: var(--muted) }
.tile .tile-n { font-size: 26px; font-weight: 800; color: var(--honey); line-height: 1 }
.grupy { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin: 6px 0 4px }
.grupy .btn { min-width: 0 }
.osoby { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.oceny { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px }
.oc { gap: 3px }
.oc-l { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sel-ocena { text-align: center; font-weight: 700 }
@media (max-width: 640px) { .oceny { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
.przyp { border: 2px solid var(--honey); background: var(--gold-bg) }
.przyp b { color: var(--gold-fg) }

.top .topin { flex-wrap: wrap }
.topin .lewo, .topin .prawo { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center }
.topin .tyt { color: var(--head); font-size: 18px; font-weight: 800 }
.potw { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: flex-end; background: var(--gold-bg); color: var(--gold-fg); border-radius: 10px; padding: 8px 12px; font-weight: 600 }
.brand .gb { background: var(--honey); color: var(--navy); border-radius: 8px; padding: 3px 12px; font-weight: 800; font-size: 18px; letter-spacing: .02em; margin-right: 6px }
.brand .who { font-size: 15px }
.plikbar { background: var(--gold-bg); color: var(--gold-fg); border-bottom: 1px solid var(--line) }
.plikbar.ok { background: var(--info); color: var(--muted) }
.plikbar.ok .plikin { font-size: 13px; padding: 6px 16px }
.plikin { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-weight: 600; font-size: 14px }
.wrap.szeroki { max-width: 1480px }
.tiles { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin: 14px 0 16px }
@media (max-width: 1200px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
@media (max-width: 760px) { .tiles { grid-template-columns: minmax(0, 1fr) } }
.tile { padding: 12px 14px }
.tile b { font-size: 16px; line-height: 1.25 }
.tile span { font-size: 13px; line-height: 1.4 }
.tile em { margin-top: auto; font-style: normal; font-size: 12px; font-weight: 700; color: var(--muted) }
.tile.done { border-top-color: var(--green) }
.tile.done em { color: var(--green) }
.grupa { display: flex; gap: 16px; align-items: stretch; margin-top: 10px }
.grupa .stan { margin: 0 0 6px }
.gnr { background: var(--navy); color: var(--honey); border-radius: var(--r); min-width: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 54px; font-weight: 800; line-height: 1 }
.gnr small { font-size: 13px; letter-spacing: .15em; text-transform: uppercase; color: #fff; margin-bottom: 4px }
.krok .kn, .kn { background: var(--honey); color: var(--navy); font-weight: 800; border-radius: 999px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px }
.krok { border-left: 4px solid var(--honey) }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; align-items: start }
@media (max-width: 760px) { .grid3 { grid-template-columns: minmax(0, 1fr) } }
.col { display: flex; flex-direction: column; gap: 10px }
.wiersz { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px }
.wiersz small { font-size: 12px; line-height: 1.35 }
.hint { margin: 0; font-size: 13px; color: var(--gold-fg); background: var(--gold-bg); border-radius: 8px; padding: 6px 10px }
.pline > span { display: flex; flex-direction: column; gap: 1px }
.pline small { font-size: 12px; color: var(--muted) }
.pline { padding: 4px 0; border-bottom: 1px dashed var(--line) }
.dziktab td:first-child { white-space: nowrap; font-weight: 700; color: var(--head) }
.dziktab td:last-child { font-size: 12px; color: var(--muted) }
.dziktab th { white-space: normal }
.lock ol { margin: 0; padding-left: 20px } .lock li + li { margin-top: 6px }
/* Przegląd EKASP */
.rplansza { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start }
@media (max-width: 760px) { .rplansza { grid-template-columns: minmax(0, 1fr) } }
.rlewa, .rprawa { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-height: 160px; display: flex; flex-direction: column; gap: 10px }
.rprawa { border: 2px dashed var(--honey); background: var(--gold-bg) }
.rlewa.nad, .rprawa.nad { outline: 3px solid var(--honey) }
.rgr { display: flex; flex-direction: column; gap: 6px }
.rks { display: flex; flex-wrap: wrap; gap: 6px }
.rk { font: 600 13px var(--font); color: var(--fg); background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: grab; display: inline-flex; gap: 6px; align-items: center }
.rk:hover, .rk:focus-visible { border-color: var(--honey); outline: none; background: var(--surface) }
.rk .rn { font-weight: 800; color: var(--head); font-variant-numeric: tabular-nums }
.rk.brak { border-style: dashed; color: var(--muted) }
.rprawa .rk { background: var(--surface) }
.rinfo { position: sticky; bottom: 0; background: var(--navy); color: #fff; border-radius: var(--r); padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; margin: 12px 0 }
.rinfo b { color: var(--honey) } .rinfo em { font-style: normal; font-size: 13px; color: #CFE0EE }
/* wydruk */
#druk { display: none }
@media print {
  body.drukuj #app, body.drukuj .brand, body.drukuj .plikbar { display: none !important }
  body.drukuj #druk { display: block }
  body.drukuj { background: #fff; color: #000; font-size: 10.5pt }
  @page { size: A4; margin: 16mm 14mm 18mm }
}
.druk-in { font-family: var(--font); color: #1F2B36; -webkit-print-color-adjust: exact; print-color-adjust: exact }
.druk-in .dp.duza { break-inside: auto; grid-template-columns: 1fr; gap: 3px }
body.szer .topin, body.szer .plikin { max-width: 1480px }
.topin { max-width: 1480px !important; flex-wrap: nowrap !important } @media (max-width: 1100px) { .topin { flex-wrap: wrap !important } }
.topin .gst { font-size: 14px }

.druk-in h1 { color: #1F4460; font-size: 18pt; margin: 2px 0 } .druk-in .dh small { color: #61788C; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 8pt } .druk-in .dh p { margin: 0; color: #61788C; font-size: 9pt }
.druk-in h2 { color: #fff; background: #1F4460; font-size: 11pt; padding: 4px 10px; margin: 14px 0 6px; break-after: avoid }

.druk-in .dk { font-weight: 700; color: #1F4460; font-size: 9pt }
.druk-in .dv { font-size: 9.5pt; white-space: pre-wrap }
.druk-in .dou { color: #C8202E; font-style: italic }
.druk-in table.dt { width: 100%; border-collapse: collapse; font-size: 8.5pt; white-space: normal }
.druk-in table.dt th { background: #EAF0F5; color: #1F4460; text-align: left; padding: 3px 5px; white-space: normal }
.druk-in table.dt td { border-top: 1px solid #D9E1E8; padding: 3px 5px; vertical-align: top }
.druk-in table.dt td:first-child { white-space: nowrap }
.druk-in .df { margin-top: 14px; padding-top: 6px; border-top: 1px solid #D9E1E8; font-size: 8pt; color: #61788C }

/* nagłówek i stopka jak w prezentacji: logo uczelni w prawym górnym rogu, logo prowadzącego w lewym dolnym */
.brand { background: #FFFFFF; color: #1F4460; padding: 10px 20px; letter-spacing: 0; text-transform: none; font-size: 18px; font-weight: 500; border-bottom: 2px solid #D9E1E8; flex-wrap: nowrap }

.topin .gb { background: var(--honey); color: var(--navy); border-radius: 8px; padding: 3px 12px; font-weight: 800; font-size: 18px }

body { padding-bottom: 44px }

.druk-in .dh { justify-content: space-between }

</head>

  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('aria-')) { e.setAttribute(k, String(v)); continue; }
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};

  const ed = polaWzoru(w).filter(p => !['typowe', 'wzor', 'wyjatkowe', 'psych', 'profil'].includes(p[7]));
  const ok = ed.filter(p => {
    if (p[7] === 'koop') return zywe(getP(d, ['pola', 'koop'])).length > 0;
    if (p[7] === 'jez') return !!getP(d, ['pola', 'jezBrak']) || zywe(getP(d, ['pola', 'jez'])).length > 0;
    return !!wartoscPola(p, d, nr);
  });
  return Math.round(ok.length / ed.length * 100);
}

// ---------- PDF opisu: wydruk A4 przez okno drukowania ----------
function drukuj() {
  const g = G(), nr = NR(), k = klucz(nr), w = WZOR_TYPU[k[2]];
  const d = DB.get(g + '_opis'), dz = DB.get(g + '_zadania'), dE = DB.get(g + '_ekasp');
  const brak = () => h('span', { class: 'dou' }, 'do uzupełnienia');
  const tab = (head, rows) => h('table', { class: 'dt' }, h('thead', {}, h('tr', {}, head.map(x => h('th', {}, x)))), h('tbody', {}, rows.map(r => h('tr', {}, r.map(c => h('td', {}, c))))));
  const out = h('div', { class: 'druk-in' });
  out.append(h('div', { class: 'dh' }, h('div', {}, h('small', {}, 'KORVEX · opis stanowiska · wzór ' + w),
    h('h1', {}, k[0] + ' ' + (getP(d, ['pola', 'nazwa']) || k[1])), h('p', {}, 'Typ: ' + k[2] + ' · Jednostka: ' + k[5] + ' · Opracowanie: grupa ' + g2(g))), h('div', { class: 'dm', html: MERITO_SVG })));
  for (const m of Object.keys(MODULY).map(Number)) {
    const pola = polaWzoru(w).filter(p => p[1] === m);
    if (!pola.length) continue;
    const sec = h('section', {}, h('h2', {}, m + '. ' + MODULY[m]));
    pola.forEach(p => {
      let val;
      switch (p[7]) {
        case 'typowe': val = tab(DZIK_HEAD, typoweWiersze(nr)); break;
        case 'wyjatkowe': { const r = wlasneWiersze(dz); val = r.length ? tab(DZIK_HEAD, r) : brak(); break; }
        case 'koop': { const r = zywe(getP(d, ['pola', 'koop'])).map(([, v]) => [v.kto || '—', v.zakres || '—', v.jak || '—']); val = r.length ? tab(['Z kim', 'W jakim zakresie', 'Jak często'], r) : brak(); break; }
        case 'jez': {
          if (getP(d, ['pola', 'jezBrak'])) { val = 'Język obcy nie jest wymagany.'; break; }
          const r = zywe(getP(d, ['pola', 'jez'])).filter(([, v]) => v.j).map(([, v]) => [v.j, v.p ? v.p + ' — ' + POZIOMY_JEZ.find(x => x[0] === v.p)[1] : '—', v.po || '—']);
          val = r.length ? tab(['Język', 'Poziom', 'Do czego potrzebny'], r) : brak(); break;
        }
        case 'profil': val = h('div', {}, h('p', {}, 'Profil kompetencyjny: ' + k[2] + ' (zdefiniowany przez organizację).'), tab(['Kompetencja', 'Zachowanie wymagane na stanowisku'], PROFILE[k[2]].map(x => [x[0], x[1]]))); break;
        case 'rodzina': { const r = RODZINY.find(x => x[0] === getP(d, ['pola', 'zawodowe'])); val = r ? h('div', {}, h('p', {}, 'Rodzina zawodów: ' + r[0] + '.'), tab(['Kompetencja zawodowa', 'Zachowanie wymagane na stanowisku'], r[1].map(x => [x[0], x[1]]))) : brak(); break; }
        case 'psych': {
          const r = PSYCH.map((x, i) => [x, getP(d, ['pola', 'psych', String(i)])]).filter(([, v]) => v).map(([x, v]) => [x[0], x[1], v + ' — ' + SKALA_W[v]]);
          if (!r.length) return;
          val = tab(['Kategoria', 'Definicja', 'Waga'], r); break;
        }
        default: { const v = wartoscPola(p, d, nr); val = v || brak(); }
      }
      sec.append(h('div', { class: 'dp' + (val && val.nodeType && val.querySelector && val.querySelector('table') || (val && val.tagName === 'TABLE') ? ' duza' : '') }, h('div', { class: 'dk' }, p[2]), h('div', { class: 'dv' }, val)));
    });
    if (m === 6) {
      const W = ekaspWyniki(dE);
      const r = EKASP.map((e, i) => [e, W[i]]).filter(([, x]) => x.final !== null).map(([e, x]) => [e[1], pl(x.final), x.final >= 5 ? 'wymaganie' : '—']);
      if (r.length) sec.append(h('div', { class: 'dp duza' }, h('div', { class: 'dk' }, 'Wagi pozycji EKASP (konsensus SME)'), h('div', { class: 'dv' }, tab(['Pozycja EKASP', 'Waga', 'W opisie'], r))));
    }
    out.append(sec);
  }
  out.append(h('div', { class: 'df' }, h('span', { class: 'dz', html: ZLOGO_SVG }), h('b', {}, 'ZMIANOLOGICA'), h('span', {}, ' · Analiza i opis pracy · zajęcia na Uniwersytecie WSB Merito Poznań · plik ' + nazwaPliku(g) + ' · ' + new Date().toLocaleString('pl-PL'))));
  const box = $('#druk'); box.replaceChildren(out);
  const t = document.title; document.title = 'AP_' + g2(g) + '_opis_' + nr;
  document.body.classList.add('drukuj');
  const po = () => { document.body.classList.remove('drukuj'); document.title = t; window.removeEventListener('afterprint', po); };
  window.addEventListener('afterprint', po);
  setTimeout(() => { window.print(); setTimeout(po, 500); }, 50);
}

// ---------- Ekran startowy, wybór grupy, blokada po przekazaniu ----------
function adres(zad, g) { const u = new URL(location.href); u.search = ''; if (zad && zad !== 'start') u.searchParams.set('zadanie', zad); return u.toString(); }
const para = g => 'G' + (nrG(g) > 5 ? nrG(g) - 5 : nrG(g) + 5);
function stanHist() { return { tab: ST.tab, grupa: G() }; }
function krok(zmiana) { zmiana(); ST.potwierdz = false; try { history.pushState(stanHist(), '', adres(ST.tab)); } catch (e) {} render(); }
function idz(k) { krok(() => { ST.tab = k; }); }
window.addEventListener('popstate', e => {
  const s = e.state || {};
  ST.tab = KEYS.includes(s.tab) ? s.tab : 'start';
  ST.grupa = GRUPY.includes(s.grupa) ? s.grupa : '';
  ST.potwierdz = false; render();
});
function tabStart(main) {
  const m = wczytajGrupe(G());

    h('div', { class: 'grupa' }, h('div', { class: 'gnr' }, h('small', {}, 'Grupa'), String(nrG(G()))), h('div', {}, stanowiskoInfo(NR()),
      h('p', { class: 'muted' }, 'To samo stanowisko opisuje niezależnie grupa ' + nrG(para(G())) + '. W omówieniu porównacie, w czym Wasze wyniki się różnią. Plik Waszej grupy: ' + nazwaPliku(G()) + '.'))));
  const tiles = h('div', { class: 'tiles' });
  ZAD.forEach(([key, nr, nazwa, opis]) => {
    const done = m.done && m.done[key], ruszone = docs.includes(G() + '_' + key);
    tiles.append(h('a', { class: 'tile' + (done ? ' done' : ''), href: adres(key, G()), onclick: e => { e.preventDefault(); idz(key); } },
      h('span', { class: 'tile-n' }, nr), h('b', {}, nazwa), h('span', {}, opis), h('em', {}, done ? '✓ zakończone' : ruszone ? 'w toku' : 'nierozpoczęte')));
  });
  main.append(tiles, h('div', { class: 'card' }, h('b', {}, 'Przejęcie pracy od innej osoby'),
    h('p', { class: 'desc' }, 'Jeśli przejmujecie pracę grupy, pobierzcie z czatu pokoju najnowszy plik ' + nazwaPliku(G()) + ' i kliknijcie „Kontynuuj pracę grupy z pliku”.'),
    h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', onclick: () => PLIK.kontynuuj() }, 'Kontynuuj pracę grupy z pliku'))));
}
function czyszczenie(main, g) {
  const m = wczytajGrupe(g);
  main.append(h('div', { class: 'card narrow' }, h('h2', {}, 'Usunąć dane grupy ' + nrG(g) + ' z tej przeglądarki?'),
    h('p', { class: 'desc' }, m.zmieniono ? 'Ostatnia zmiana: ' + new Date(m.zmieniono).toLocaleString('pl-PL') + '. Plik grupy zapisany na dysku zostaje bez zmian.' : 'Ta przeglądarka nie ma danych grupy ' + nrG(g) + '.'),
    h('div', { class: 'actions' },
      h('button', { class: 'btn', type: 'button', onclick: async () => {
        try { localStorage.removeItem(KL + g); if (OSTATNIA === g) localStorage.removeItem(KL + 'wybrana'); } catch (e) {} delete mem[g]; delete PLIK.h[g]; delete PLIK.stan[g];
        await IDB.set(g, null);
        location.replace(adres('start'));
      } }, 'Tak, usuń dane grupy ' + nrG(g)),
      h('a', { class: 'btn', href: adres('start') }, 'Anuluj'))));
}
function wyborGrupy(main) {
  const przyciski = GRUPY.map(g => {
    const m = wczytajGrupe(g), ost = g === OSTATNIA;
    return h('button', { class: 'btn gbtn' + (ost ? ' ost' : ''), type: 'button', onclick: () => { OSTATNIA = g; try { localStorage.setItem(KL + 'wybrana', g); } catch (e) {} ST.poprz = ''; krok(() => { ST.grupa = g; }); } },
      h('span', { class: 'gl' }, 'Grupa ' + nrG(g)),
      m.zmieniono ? h('small', {}, 'są dane, ostatnia zmiana ' + godz(m.zmieniono)) : null,

  });
  main.append(h('div', { class: 'card narrow wide' }, h('h2', {}, 'Wybierzcie swoją grupę'),
    h('p', { class: 'muted' }, 'Numer grupy to numer pokoju w Teams. Jeśli przejmujecie pracę od innej osoby z grupy, wybierzcie grupę, a potem kliknijcie „Kontynuuj pracę grupy z pliku”. Przy grupach, które mają już dane w tej przeglądarce, widać godzinę ostatniej zmiany.'),
    h('div', { class: 'grupy' }, przyciski),
    h('div', { class: 'actions' }, ST.poprz ? h('button', { class: 'btn', type: 'button', onclick: () => history.back() }, 'Wróć do grupy ' + nrG(ST.poprz)) : h('a', { class: 'btn', href: 'index.html' }, 'Wróć do strony startowej')),
    FS_OK ? '' : h('p', { class: 'no' }, 'Ta przeglądarka nie zapisuje pliku grupy automatycznie. Najlepiej pracować w Chrome albo Edge na komputerze.')));
}
function zablokowana(main) {
  const g = G(), m = wczytajGrupe(g);
  const pot = h('div', { class: 'actions', hidden: true }, h('span', { class: 'no' }, 'Odblokowanie pozwala pisać w tej przeglądarce. Jeśli następna osoba już pracuje, powstaną dwie różne wersje pracy grupy.'),
    h('button', { class: 'btn', type: 'button', onclick: () => { delete m.lock; zapiszGrupe(g); render(); } }, 'Tak, odblokuj'));
  main.append(h('div', { class: 'card narrow lock' }, h('h2', {}, 'Praca grupy ' + nrG(g) + ' przekazana o ' + godz(m.lock)),
    h('ol', {}, h('li', {}, 'Wyślijcie plik ' + nazwaPliku(g) + ' na czat pokoju grupy: spinacz, „Prześlij z tego urządzenia”, plik z folderu Pobrane albo z miejsca, w którym go zapisaliście.'),
      h('li', {}, 'Następna osoba pobiera plik z czatu, otwiera tę stronę i klika „Kontynuuj pracę grupy z pliku”.'),
      h('li', {}, 'Ta przeglądarka jest zablokowana, żeby nikt nie pisał równolegle. Aby wrócić do pisania, wczytajcie nowszy plik z czatu.')),
    h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', onclick: () => PLIK.kontynuuj() }, 'Kontynuuj pracę grupy z pliku'),
      h('button', { class: 'btn', type: 'button', onclick: () => { pot.hidden = false; } }, 'Odblokuj mimo to')), pot));
}

// ---------- Ramy aplikacji ----------
function naglowek() {
  const top = $('#topin'); const g = G();
  const z = ZAD.find(x => x[0] === ST.tab);
  if (!g) { top.replaceChildren(h('b', { class: 'tyt' }, 'Analiza i opis pracy — praca w grupach')); return; }
  const potw = h('div', { class: 'potw', hidden: !ST.potwierdz }, h('span', {}, 'Zmienić grupę? Dane grupy ' + nrG(g) + ' zostają w pliku i w tej przeglądarce.'),
    h('button', { class: 'btn', type: 'button', onclick: () => { ST.poprz = G(); krok(() => { ST.grupa = ''; }); } }, 'Tak, zmień grupę'),
    h('button', { class: 'btn', type: 'button', onclick: () => { ST.potwierdz = false; naglowek(); } }, 'Anuluj'));
  top.replaceChildren(
    h('div', { class: 'lewo' }, h('span', { class: 'gb' }, 'Grupa ' + nrG(g)), h('span', { class: 'gst' }, klucz(NR()).slice(0, 2).join(' ')), h('b', { class: 'tyt' }, z ? z[1] + ' · ' + z[2] : 'Wszystkie zadania'), z ? h('button', { class: 'btn', type: 'button', onclick: () => idz('start') }, 'Wszystkie zadania') : null),
    h('div', { class: 'prawo' }, h('span', { class: 'status', id: 'status', 'aria-live': 'polite' }),
      wczytajGrupe(g).lock ? null : h('button', { class: 'btn', type: 'button', onclick: () => PLIK.przekaz() }, 'Przekaż pracę'),
      h('button', { class: 'btn', type: 'button', onclick: () => { ST.potwierdz = true; naglowek(); } }, 'Zmień grupę')),
    potw);
}
function render() {
  ST.unsub.forEach(u => { try { u(); } catch (e) {} }); ST.unsub = [];
  const main = $('#main'); main.replaceChildren();
  const g = G();
  naglowek();
  main.className = 'wrap' + (ST.tab === 'start' ? ' szeroki' : '');
  document.body.classList.toggle('szer', ST.tab === 'start' || !g);
  const wycz = 'G' + (URLP.get('wyczysc') || '');
  if (GRUPY.includes(wycz)) czyszczenie(main, wycz);
  else if (!g) wyborGrupy(main);
  else if (wczytajGrupe(g).lock) zablokowana(main);
  else if (ST.tab === 'start') tabStart(main);
  else ({ nazwy: tabNazwy, sme: tabSme, przeglad: tabPrzeglad, ekasp: tabEkasp, wzor: tabWzor, zadania: tabZadania, opis: tabOpis })[ST.tab](main);
  pasekPliku();
  if (g) PLIK.przywroc(g);
  window.scrollTo(0, 0);
}
try { localStorage.setItem(KL + 'test', '1'); localStorage.removeItem(KL + 'test'); } catch (e) { PAMIEC_OK = false; }
try { history.replaceState(stanHist(), '', adres(ST.tab)); } catch (e) {}
render();
if (!PAMIEC_OK) status('err', 'Przeglądarka nie zapisuje danych (np. tryb prywatny). Otwórzcie stronę w zwykłym oknie Chrome albo Edge.');
