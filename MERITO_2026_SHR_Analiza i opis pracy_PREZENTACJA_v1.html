<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analiza i opis pracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>
:root { --navy: #1F4460; --navy2: #163450; --honey: #E8B62C; --honey-soft: #FBF0CF; --ink: #1F2B36; --muted: #61788C; --line: #D9E1E8; --bg: #F5F5F7; --info: #F0F6FB;
  --font: "Montserrat", "Segoe UI", system-ui, sans-serif }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0; height: 100%; background: #0E1B26; font-family: var(--font); overflow: hidden }
#stage { position: fixed; inset: 0 0 56px 0; display: grid; place-items: center }
#canvas { width: 1280px; height: 720px; position: relative; transform-origin: center center; background: var(--bg); color: var(--ink); overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.4) }
.bar { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; justify-content: center; gap: 12px; background: #0E1B26 }
.bar .cnt { color: #9BB0C2; font: 600 14px var(--font); min-width: 70px; text-align: center; font-variant-numeric: tabular-nums }
.btn { font: 700 14px var(--font); background: var(--honey); color: var(--ink); border: 0; border-radius: 999px; padding: 9px 20px; min-width: 130px; cursor: pointer }
.btn:hover { background: #B68C20 }
.btn:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 2px }
/* plansza */
.slide { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 44px 56px 0 }
.head { flex: 0 0 auto; margin-bottom: 22px }
.kick { font-size: 15px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--honey); margin-bottom: 6px }
.h { font-size: 38px; font-weight: 800; color: var(--navy); line-height: 1.15; margin: 0; text-wrap: balance }
.body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; font-size: var(--fs, 24px); line-height: 1.38; padding-bottom: 14px }
.foot { flex: 0 0 auto; background: var(--info); border-left: 6px solid var(--navy); border-radius: 0 12px 12px 0; padding: .6em .9em; margin-top: .6em; font-size: .82em }
.footer { flex: 0 0 auto; height: 44px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; font-weight: 600; margin: 0 -56px; padding: 0 56px }
.footer b { color: var(--navy) }
/* punkty */
.plist { flex: 1; display: grid; gap: .55em; grid-auto-rows: 1fr }
.pt { background: #FFFFFF; border: 1px solid var(--line); border-radius: 14px; padding: .55em .8em; display: flex; gap: .7em; align-items: center }
.pt .n { flex: 0 0 auto; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--navy); color: var(--honey); font-weight: 800; display: grid; place-items: center; font-size: .9em }
/* dwie kolumny */
.two { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: .8em; min-height: 0 }
.col { background: #FFFFFF; border: 1px solid var(--line); border-radius: 16px; padding: .8em 1em; display: flex; flex-direction: column; gap: .5em }
.col h3 { margin: 0 0 .1em; font-size: 1.05em; color: var(--navy) }
.col h3::before { content: ''; display: inline-block; width: .55em; height: .55em; background: var(--honey); border-radius: 3px; margin-right: .45em; vertical-align: .08em }
.col ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; justify-content: space-around; flex: 1; gap: .4em; min-height: 0 }
.col { min-height: 0 }
/* siatka */
.grid { flex: 1; display: grid; gap: .6em; grid-auto-rows: 1fr; min-height: 0 }
.gc { background: #FFFFFF; border: 1px solid var(--line); border-top: 6px solid var(--navy); border-radius: 14px; padding: .6em .8em; display: flex; flex-direction: column; gap: .25em }
.gc b { color: var(--navy); font-size: 1.02em }
.gc span { font-size: .9em }
/* tabela */
.tw { flex: 1; min-height: 0; display: flex }
table { width: 100%; border-collapse: separate; border-spacing: 0; background: #FFFFFF; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; font-size: .82em; height: 100% }
th { background: var(--navy); color: #FFFFFF; text-align: left; padding: .45em .7em; font-weight: 700 }
td { padding: .4em .7em; border-top: 1px solid var(--line); vertical-align: middle }
td:first-child { font-weight: 700; color: var(--navy) }
/* osoby */
.people { flex: 1; display: grid; gap: .6em; grid-auto-rows: 1fr; min-height: 0 }
.pc { background: #FFFFFF; border: 1px solid var(--line); border-radius: 16px; padding: .5em .7em; display: flex; gap: .7em; align-items: center; min-height: 0 }
.pc svg { flex: 0 0 auto; height: 100%; max-height: 150px; width: auto; aspect-ratio: 280 / 300 }
.pc b { display: block; color: var(--navy); font-size: 1.05em; margin-bottom: .15em }
.pc span { font-size: .88em }
/* kroki */
.steps { flex: 1; display: grid; gap: .6em; grid-auto-rows: 1fr; min-height: 0 }
.st { background: #FFFFFF; border: 1px solid var(--line); border-radius: 14px; padding: .55em .75em; display: flex; flex-direction: column; gap: .2em; position: relative }
.st .sn { font-size: 1.5em; font-weight: 800; color: var(--honey); line-height: 1 }
.st b { color: var(--navy) }
.st span { font-size: .86em }
.st i { font-style: normal; font-size: .72em; font-weight: 700; color: var(--muted); margin-top: auto; text-transform: uppercase; letter-spacing: .08em }
/* ćwiczenie */
.task { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: .8em; min-height: 0 }
.task .plist { min-height: 0 }
.task .side { background: var(--navy); color: #FFFFFF; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; font-size: 20px }
.task .side .lab { color: var(--honey); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 15px }
.task .side .tab { font-size: 42px; font-weight: 800; line-height: 1.15; margin-top: 6px }
.task .side .meta { color: #D9E1E8; font-size: 20px; line-height: 1.4 }
a.lbtn { display: block; text-align: center; text-decoration: none; font: 700 16px var(--font); background: var(--honey); color: var(--ink); border-radius: 999px; padding: 12px 18px }
a.lbtn:hover { background: #B68C20 }
.linkrow { margin-top: .6em; display: flex; justify-content: flex-end }
.linkrow a.lbtn { min-width: 330px }
/* tytuł i przekładki */
.title { position: absolute; inset: 0; display: grid; grid-template-columns: 460px 1fr; background: var(--navy); color: #FFFFFF }
.title .lg { display: grid; place-items: center; background: var(--navy2) }
.title .tx { padding: 70px 60px; display: flex; flex-direction: column; justify-content: center; gap: 18px }
.title h1 { font-size: 64px; line-height: 1.05; margin: 0; font-weight: 800 }
.title .sub { font-size: 24px; color: #D9E1E8; line-height: 1.4 }
.title .who { font-size: 20px; font-weight: 700; color: var(--honey); margin-top: 20px }
.title .org { font-size: 16px; color: #9BB0C2; letter-spacing: .14em; text-transform: uppercase; font-weight: 700 }
.div { position: absolute; inset: 0; display: grid; grid-template-columns: 330px 1fr; background: var(--navy); color: #FFFFFF }
.div .num { display: grid; place-items: center; font-size: 200px; font-weight: 800; color: var(--honey); background: var(--navy2) }
.div .tx { padding: 60px; display: flex; flex-direction: column; justify-content: center; gap: 24px }
.div h2 { font-size: 54px; line-height: 1.1; margin: 0; font-weight: 800; text-wrap: balance }
.div p { font-size: 26px; line-height: 1.45; color: #D9E1E8; margin: 0 }
.div .part { color: var(--honey); font-weight: 800; letter-spacing: .16em; text-transform: uppercase; font-size: 16px }
/* agenda */
.agenda { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: .4em 1.2em }
.ag { display: flex; align-items: center; gap: .7em; background: #FFFFFF; border: 1px solid var(--line); border-radius: 12px; padding: 0 .8em; font-weight: 600 }
.ag .n { flex: 0 0 auto; width: 1.6em; height: 1.6em; border-radius: 8px; background: var(--honey); color: var(--ink); font-weight: 800; display: grid; place-items: center; font-size: .85em }
/* DZIK */
.dzik { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: auto 1fr; gap: .6em; min-height: 0 }
.dz { border-radius: 16px; padding: .6em .8em; color: #FFFFFF; display: flex; flex-direction: column; gap: .2em }
.dz .L { font-size: 2.6em; font-weight: 800; line-height: 1 }
.dz b { font-size: 1.05em } .dz span { font-size: .85em; opacity: .9 }
.ex { grid-column: 1 / -1; background: #FFFFFF; border: 1px solid var(--line); border-radius: 16px; padding: .7em 1em; display: flex; flex-direction: column; justify-content: center; gap: .55em }
.ex .lab { font-size: .7em; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.ex .s mark { background: none; padding: .05em .25em; border-radius: 6px; border-bottom: 4px solid; color: var(--ink) }
.c1 { background: #1F4460 } .c2 { background: #2E5878 } .c3 { background: #61788C } .c4 { background: #B68C20 }
.m1 { border-color: #1F4460 !important } .m2 { border-color: #2E5878 !important } .m3 { border-color: #61788C !important } .m4 { border-color: #E8B62C !important }
.src { flex: 1; display: flex; flex-direction: column; justify-content: space-around; font-size: .78em }
.src p { margin: 0; padding-left: 1em; text-indent: -1em }
/* spis */
#toc { position: fixed; inset: 0 0 56px 0; background: rgba(14,27,38,.96); color: #FFFFFF; padding: 40px; overflow: auto; z-index: 10 }
#toc .in { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
#toc button { text-align: left; font: 600 16px var(--font); background: #162836; color: #E6EDF3; border: 1px solid #263E51; border-radius: 10px; padding: 12px 14px; cursor: pointer }
#toc button b { color: var(--honey); margin-right: 8px }
</style>
</head>
<body>
<div id="stage"><div id="canvas"></div></div>
<div class="bar">
  <button class="btn" id="prev" type="button">Wstecz</button>
  <button class="btn" id="tocb" type="button">Spis</button>
  <span class="cnt" id="cnt"></span>
  <button class="btn" id="fs" type="button">Pełny ekran</button>
  <button class="btn" id="next" type="button">Dalej</button>
</div>
<div id="toc" hidden><div class="in" id="tocin"></div></div>

 { t: 'div', n: 1, h: 'Czym jest analiza i opis pracy', lead: 'Zaczynamy od rozróżnienia procesu, jego wyniku i przedmiotu: analizujemy pracę na stanowisku, a nie osobę, która ją wykonuje.' },
 { t: 'two', h: 'Analiza pracy i opis stanowiska to dwie różne rzeczy',
   l: { h: 'Analiza pracy — proces', items: [
     'Systematyczne zbieranie informacji o zadaniach, warunkach i wymaganiach stanowiska, prowadzone według ustalonej procedury.',
     'Prowadzą ją osoby, które znają tę pracę (eksperci przedmiotowi), pod kierunkiem osoby znającej metodę.',
     'Korzysta z obserwacji, wywiadów, dokumentów i kwestionariuszy, takich jak EKASP.' ] },
   r: { h: 'Opis stanowiska — wynik', items: [
     'Dokument, który zapisuje wynik analizy w ustalonym wzorze, jednakowym dla stanowisk danego typu.',
     'Ten sam wynik analizy zasila też inne dokumenty: profil kandydata, plan szkoleń, taryfikator płac.',
     'Opis bez analizy powstaje z wyobrażeń jednej osoby o pracy, a nie z ustaleń kilku osób, które tę pracę znają.' ] } },
 { t: 'two', h: 'Opisujemy stanowisko, a nie osobę, która je zajmuje',
   l: { h: 'Opis stanowiska', items: [
     'Odpowiada na pytanie, jaka praca jest wykonywana, w jakich warunkach i jakie wymagania stawia.',
     'Nie zmienia się, gdy na stanowisku zmienia się osoba; zmienia się, gdy zmienia się praca.' ] },
   r: { h: 'Opis osoby', items: [

     'Zmienia się z każdą osobą i z jej rozwojem.' ] },
   foot: 'Porównanie wymagań stanowiska z kompetencjami osoby pokazuje lukę kompetencyjną. Takie porównanie jest możliwe tylko wtedy, gdy oba dokumenty istnieją osobno.' },
 { t: 'grid', h: 'Metody analizy pracy', k: 'Sześć grup metod', items: [
   ['Ogólna analiza pracy', 'Kwestionariusze obejmujące wiele wymiarów pracy, np. PAQ i EKASP; wymagają zespołu ekspertów.'],
   ['Analiza funkcjonalna', 'Opisuje pracę przez stosunek do danych, ludzi i rzeczy oraz poziom złożoności każdego z nich.'],
   ['Inwentarze zadań', 'Listy zadań dla określonej grupy zawodów, oceniane pod względem częstotliwości i ważności.'],
   ['Elementy pracy', 'Wymagania opisane jako wiedza, umiejętności, zdolności i inne cechy (model KSAO).'],

   ['Analiza kompetencji', 'Profil zachowań wymaganych na stanowisku, często używany zamiast klasycznej analizy pracy.'] ],
   foot: 'Na podstawie: Lees i Cordery (2003), Analiza i projektowanie pracy.' },
 { t: 'two', h: 'Kiedy analiza pracy jest warta wysiłku',

     'Niejasne kryteria selekcji i rozbieżne wymagania kierowników.',
     'Wymagania zewnętrzne: audyt klienta, przepisy BHP, kontrola.' ] },
   r: { h: 'Dyskusyjna', items: [

     'Mała firma bez procesów, które korzystałyby z opisów.',
     'Brak osób i czasu na rzetelne przeprowadzenie analizy.',
     'Opis, który nie zostanie użyty w żadnym procesie HR.' ] } },

 { t: 'div', n: 2, h: 'Interesariusze i wykorzystanie danych', lead: 'Z opisu stanowiska korzysta kilka grup w organizacji, a każda potrzebuje innych pól. Od tego zależy, co powinno się znaleźć we wzorze.' },
 { t: 'people', h: 'Kto korzysta z opisu stanowiska', items: [

 { t: 'steps', h: 'Osiem kroków od decyzji do aktualnych opisów', items: [

 { t: 'points', h: 'Zasada doboru pól', items: [

 { t: 'div', n: 5, h: 'Typologia: dwa wzory i sześć typów', lead: 'Opis ma dwa wzory: specjalistyczny i menedżerski. Typów stanowisk jest więcej, bo typ decyduje o treści opisu, a wzór o jego układzie.' },
 { t: 'two', h: 'O wzorze decyduje jedno pytanie: czy stanowisko kieruje pracą podwładnych?',
   l: { h: 'Wzór S — specjalistyczny', items: [
     'Stanowisko nie ma podwładnych w ramach podległości służbowej.',
     'Koordynowanie pracy innych bez podległości służbowej, np. w projekcie, zapisuje się jako zadanie z kategorii współpracy, a nie jako podstawę wzoru M.' ] },
   r: { h: 'Wzór M — menedżerski', items: [
     'Stanowisko przydziela zadania podwładnym, rozlicza ich pracę i ocenia ją jako przełożony służbowy.',
     'Wzór M zawiera wszystkie pola wzoru S oraz pola dotyczące podwładnych, budżetu i odpowiedzialności za zespół.' ] } },
 { t: 'table', h: 'Sześć typów stanowisk', head: ['Typ', 'Wzór', 'Kryterium', 'Wzorzec nazwy'], rows: [
   ['Wykonawca', 'S', 'praca według instrukcji i norm; zakres wyznacza przełożony lub plan', 'nazwa zawodu + zakres'],
   ['Specjalista', 'S', 'samodzielna praca według standardów i procedur', 'Specjalista ds. + zakres'],
   ['Ekspert', 'S', 'złożone, niestandardowe problemy i doradzanie innym', 'Ekspert ds. + zakres'],
   ['Lider', 'M', 'bezpośrednie kierowanie zespołem, zwykle z udziałem we własnej pracy zespołu', 'Kierownik zespołu + zakres'],
   ['Manager', 'M', 'kierowanie jednostką przez kierowników albo całą jednostką z budżetem', 'Kierownik działu + zakres'],
   ['Strateg', 'M', 'pion lub cała organizacja; decyzje o skutkach rozłożonych na lata', 'Dyrektor + zakres; Członek zarządu'] ],
   foot: 'Stopnie w obrębie typu (wejściowy, samodzielny, wiodący) wyraża kategoria zaszeregowania, a nie nazwa. Ekspert nie jest starszym specjalistą: o typie decyduje charakter pracy, nie staż.' },
 { t: 'points', h: 'Co wynika z typu stanowiska', k: 'Klasyfikator', items: [
   'Wzór decyduje o układzie dokumentu: wszystkie opisy wzoru S mają te same pola, a opisy wzoru M mają dodatkowo pola kierownicze.',
   'Typ decyduje o treści: wskazuje zadania typowe wpisywane hurtowo, przedział kategorii zaszeregowania i słowo poziomu w nazwie stanowiska.',
   'Klasyfikator najpierw jednym pytaniem rozstrzyga wzór, a potem sześcioma pytaniami wskazuje typ w obrębie wzoru; wynik graniczny jest sygnałem do rozmowy w grupie, a nie do automatycznej decyzji.' ],
   link: [KLAS, 'Otwórz klasyfikator stanowisk'] },

 // ---------- 6 (punkt 7) ----------
 { t: 'div', n: 6, h: 'Wzór opisu dla stanowiska, nie dla osoby', lead: 'Częsty błąd: wzór budowany na przykładzie jednego stanowiska, z nazwiskiem pracownika w nagłówku. Wszystkie opisy jednego wzoru mają tę samą strukturę.' },
 { t: 'two', h: 'Ten sam błąd w dwóch odmianach',

   foot: 'Imiona i nazwiska występują w opisie tylko w module 10: przy osobach z zespołu SME, które opracowały opis, i przy osobach, które go zatwierdziły.' },
 { t: 'table', h: 'Jeden wzór S, dwa różne stanowiska', head: ['Pole wzoru S', 'S-003 Operator maszyn przetwórczych', 'S-020 Specjalista ds. kadr i płac'], rows: [

   ['Dostęp do danych i systemów', 'terminal zbiorczy na hali', 'system kadrowo-płacowy, upoważnienie do danych pracowników'],

   ['Obowiązki BHP (art. 211 KP)', 'wpis z wzoru', 'wpis z wzoru — ta sama treść'] ],

 // ---------- 7 (punkt 8) ----------
 { t: 'div', n: 7, h: 'Porządkowanie struktury i nazw stanowisk', lead: 'Zanim powstanie pierwszy opis, trzeba ustalić, ile jest stanowisk i jak się nazywają. Inaczej opisy powielą istniejący chaos.' },
 { t: 'grid', h: 'Pięć problemów, które spotkacie w KORVEX', items: [
   ['Ta sama praca, kilka nazw', 'Operator maszyny i operator sztancy; spedytor, logistyk i koordynator transportu.'],
   ['Jedna nazwa, różna praca', '„Pracownik produkcji” obejmuje pakowanie oraz pomoc operatorom przy przezbrojeniach.'],
   ['Nazwa bez poziomu i zakresu', 'Handlowiec, Informatyk, Office Manager — nazwa nie mówi, jaki to typ i jaki zakres.'],
   ['Tytuł sugeruje typ, którego nie ma', 'Dyrektor ds. rozwoju bez podwładnych; Key Account Manager, który nikim nie kieruje.'],
   ['Rola zapisana jako stanowisko', 'Pełnomocnik ds. jakości to rola powierzona osobie zajmującej inne stanowisko.'] ] },
 { t: 'points', h: 'Reguły porządkowania', items: [
   'Nazwa stanowiska składa się z poziomu i zakresu działania: poziom wynika z typu (Specjalista, Ekspert, Kierownik zespołu, Kierownik działu, Dyrektor), a zakres pochodzi ze słownika zakresów.',
   'Stanowisko to praca, a nie osoba ani zmiana: trzech prowadzących zmiany na produkcji to jedno stanowisko „Kierownik zespołu produkcji” obsadzone przez trzy osoby.',
   'Stopnie w obrębie typu wyraża kategoria zaszeregowania; tytuły w rodzaju „starsza księgowa” nadawane w uznaniu stażu nie tworzą odrębnego stanowiska.',
   'Każde stanowisko otrzymuje stały numer z literą wzoru, np. S-020 lub M-004; numer nie zmienia się przy reorganizacji, więc odwołania między opisami pozostają prawidłowe.' ] },
 { t: 'task', h: 'Ćwiczenie: uporządkujcie nazwy stanowisk', tab: 'Nazwy', steps: [
   'Otwórzcie stronę ' + START + ', przycisk „Praca w grupach”, wpiszcie imię i wybierzcie swoją grupę.',
   'W zakładce Nazwy każda grupa ma obecne nazwy stanowisk z przydzielonych działów wraz z opisem pracy.',
   'Przy każdej nazwie wpiszcie nazwę docelową według reguły poziom + zakres i wybierzcie typ. Gdy kilka nazw opisuje tę samą pracę, wpiszcie tę samą nazwę docelową.',
   'Przy trudnych przypadkach użyjcie klasyfikatora i zapiszcie, co przesądziło o decyzji.' ],
   meta: 'Praca w grupach · około 40 minut' },
 { t: 'points', h: 'Omówienie: rozstrzygnięcia, które wymagają decyzji', items: [
   'Mistrz zmiany i brygadzista to jedno stanowisko typu Lider; zmiana, na której pracuje osoba, jest atrybutem obsady, a nie cechą stanowiska.',
   '„Pracownik produkcji” to dwa stanowiska, bo pakowanie i pomoc przy przezbrojeniach różnią się zadaniami, narzędziami i wymaganiami.',
   'Dyrektor ds. rozwoju to Ekspert ds. inwestycji; zmiana nazwy dotyczy statusu osoby, więc wymaga decyzji zarządu i rozmowy z pracownikiem, a nie tylko pracy HR.',
   'Informatyk i administrator IT wykonują pracę z jednego zakresu, ale podlegają różnym przełożonym; porządkowanie nazw ujawniło tu problem podległości.' ] },

 // ---------- 8 (punkt 9) ----------
 { t: 'div', n: 8, h: 'Eksperci przedmiotowi (SME)', lead: 'SME to osoby, które znają pracę na stanowisku od środka. Bez nich opis powstaje z wyobrażeń działu HR o cudzej pracy.' },
 { t: 'people', h: 'Kto może być SME — i z jakim ryzykiem', items: [
   ['p6', 'Pracownik na stanowisku', 'Zna szczegóły czynności i trudności; może zawyżać wymagania własnego stanowiska.'],
   ['l2', 'Przełożony', 'Widzi wymagania i efekty pracy; może nie znać szczegółów czynności i opisywać oczekiwania zamiast stanu.'],
   ['a1', 'HR', 'Zna metodę i pilnuje spójności opisów; nie zna specyfiki pracy, więc nie może zastąpić pozostałych.'],
   ['h1', 'BHP', 'Zna ryzyka, przepisy i środki ochrony; ocenia warunki pracy i wymagania fizyczne.'] ] },
 { t: 'points', h: 'Dobór i przygotowanie zespołu SME', items: [

let uid = 0;
function figure(id) {
  const p = POSTACI[id]; const k = 'f' + (uid++); const [c, h] = dress(p.group);
  return `<svg viewBox="0 0 280 300" aria-hidden="true"><defs><clipPath id="${k}"><rect width="280" height="280"/></clipPath></defs><image href="${p.face}" width="280" height="280"/><g clip-path="url(#${k})">${c}</g>${h}</svg>`;
}

const head = (s) => `<div class="head">${s.k ? `<div class="kick">${esc(s.k)}</div>` : ''}<h2 class="h">${esc(s.h)}</h2></div>`;
const foot = (s) => s.foot ? `<div class="foot">${esc(s.foot)}</div>` : '';
const link = (s) => s.link ? `<div class="linkrow"><a class="lbtn" href="${s.link[0]}" target="_blank" rel="noopener">${esc(s.link[1])}</a></div>` : '';
const cols = n => n <= 3 ? 1 : n <= 4 ? 2 : n <= 6 ? (n === 5 ? 3 : 3) : 4;

const R = {
  title: () => `<div class="title"><div class="lg">${LOGO}</div><div class="tx">
    <div class="org">Studia podyplomowe · MERITO</div>
    <h1>Analiza i opis pracy</h1>
    <div class="sub">Od analizy stanowiska do opisu, który działa jak baza danych</div>
    <div class="who">dr Marcin Żółtak · ZMIANOLOGICA</div></div></div>`,
  div: s => `<div class="div"><div class="num">${s.n}</div><div class="tx"><div class="part">Część ${s.n}</div><h2>${esc(s.h)}</h2><p>${esc(s.lead)}</p></div></div>`,
  points: s => `${head(s)}<div class="body fit"><div class="plist" style="grid-template-columns:repeat(${s.items.length > 4 ? 2 : 1},1fr)">${s.items.map((t, i) => `<div class="pt"><span class="n">${i + 1}</span><span>${esc(t)}</span></div>`).join('')}</div>${foot(s)}${link(s)}</div>`,
  two: s => `${head(s)}<div class="body fit"><div class="two">${[s.l, s.r].map(c => `<div class="col"><h3>${esc(c.h)}</h3><ul>${c.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')}</div>${foot(s)}</div>`,
  grid: s => `${head(s)}<div class="body fit"><div class="grid" style="grid-template-columns:repeat(${s.items.length === 4 ? 2 : s.items.length === 10 ? 5 : s.items.length > 6 ? 2 : 3},1fr)">${s.items.map(x => `<div class="gc"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>${foot(s)}${link(s)}</div>`,
  table: s => `${head(s)}<div class="body fit"><div class="tw"><table><thead><tr>${s.head.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${foot(s)}</div>`,
  people: s => `${head(s)}<div class="body fit"><div class="people" style="grid-template-columns:repeat(${s.items.length > 4 ? 3 : 2},1fr)">${s.items.map(x => `<div class="pc">${figure(x[0])}<div><b>${esc(x[1])}</b><span>${esc(x[2])}</span></div></div>`).join('')}</div>${foot(s)}</div>`,
  steps: s => `${head(s)}<div class="body fit"><div class="steps" style="grid-template-columns:repeat(${s.items.length === 8 ? 4 : s.items.length === 5 ? 5 : 3},1fr)">${s.items.map((x, i) => `<div class="st"><span class="sn">${i + 1}</span><b>${esc(x[0])}</b><span>${esc(x[1])}</span>${x[2] ? `<i>${esc(x[2])}</i>` : ''}</div>`).join('')}</div>${foot(s)}</div>`,
  task: s => `${head({ k: 'Ćwiczenie', h: s.h })}<div class="body fit"><div class="task"><div class="plist" style="grid-template-columns:1fr">${s.steps.map((t, i) => `<div class="pt"><span class="n">${i + 1}</span><span>${esc(t)}</span></div>`).join('')}</div>
    <div class="side"><div><div class="lab">Zakładka w formularzach</div><div class="tab">${esc(s.tab)}</div><div class="meta" style="margin-top:14px">${esc(s.meta)}</div></div>
    <div><div class="meta" style="margin-bottom:12px">Adres dla uczestników:<br><b style="color:#E8B62C">${START}</b></div><a class="lbtn" href="${FORM}" target="_blank" rel="noopener">Podgląd pracy grup</a></div></div></div></div>`,
  agenda: s => `${head(s)}<div class="body fit"><div class="agenda">${s.items.map((t, i) => `<div class="ag"><span class="n">${i + 1}</span>${esc(t)}</div>`).join('')}</div></div>`,
  dzik: () => `${head({ k: 'Opis zadania', h: 'DZIK — jedno zadanie w jednym zdaniu' })}<div class="body fit"><div class="dzik">
    <div class="dz c1"><span class="L">D</span><b>Działanie</b><span>Co dokładnie robi osoba na stanowisku: jeden konkretny czasownik.</span></div>
    <div class="dz c2"><span class="L">Z</span><b>Dla kogo / z kim</b><span>Kto jest odbiorcą lub partnerem tej czynności.</span></div>
    <div class="dz c3"><span class="L">I</span><b>Instrument</b><span>Przy użyciu jakiego narzędzia, systemu lub procedury.</span></div>
    <div class="dz c4"><span class="L">K</span><b>Korzyść</b><span>Jaki rezultat daje czynność; nie powtarza działania.</span></div>
    <div class="ex"><span class="lab">Przykład z KORVEX — S-020 Specjalista ds. kadr i płac</span>
      <div class="s"><mark class="m1">nalicza wynagrodzenia</mark> <mark class="m2">dla pracowników wszystkich zmian</mark> <mark class="m3">w systemie kadrowo-płacowym, na podstawie ewidencji czasu pracy</mark> <mark class="m4">w celu terminowej i poprawnej wypłaty</mark>.</div>
      <span class="lab">Przykład z KORVEX — S-003 Operator maszyn przetwórczych</span>
      <div class="s"><mark class="m1">przezbraja sztancę przy zmianie zlecenia</mark> <mark class="m2">dla zespołu zmiany</mark> <mark class="m3">według karty technologicznej zlecenia</mark> <mark class="m4">w celu rozpoczęcia produkcji bez braków</mark>.</div></div></div></div>`,
  sources: () => `${head({ k: 'Literatura', h: 'Źródła' })}<div class="body fit"><div class="src">
    <p>Biela, A., Rożnowski, B. (2018). Europejski Kwestionariusz Analizy Stanowisk Pracy (EKASP). Studia Oeconomica Posnaniensia, 6(3), 5–26.</p>
    <p>Biela, A. (2018). Analiza stanowisk pracy i jej synteza. EKASP. Lublin: Wydawnictwo UMCS.</p>
    <p>Lees, C., Cordery, J. L. (2003). Analiza i projektowanie pracy. W: N. Chmiel (red.), Psychologia pracy i organizacji. Gdańsk: GWP.</p>
    <p>McCormick, E. J., Mecham, R. C., Jeanneret, P. R. (1989). Technical manual for the Position Analysis Questionnaire (PAQ). Logan: PAQ Services.</p>
    <p>Morgeson, F. P., Campion, M. A. (2012). A framework of potential sources of inaccuracy in job analysis. W: M. A. Wilson i in. (red.), The handbook of work analysis. New York: Routledge.</p>
    <p>Ustawa z dnia 26 czerwca 1974 r. — Kodeks pracy, art. 211, 212, 237¹¹.</p></div></div>`,
};

const canvas = document.getElementById('canvas');
let cur = 0;
function fit(el) {
  const target = el.parentElement.classList.contains('slide') ? el : el;
  let lo = 15, hi = 34;
  const ok = () => el.scrollHeight <= el.clientHeight + 1 && [...el.querySelectorAll('.pt,.gc,.col,.st,.pc,.ag,.dz,.ex,td,.tw,.task,.two,.grid,.plist,.people,.steps,.agenda,.dzik,.src,ul')].every(x => x.scrollHeight <= x.clientHeight + 2 && x.scrollWidth <= x.clientWidth + 2);
  for (let i = 0; i < 9; i++) { const m = (lo + hi) / 2; el.style.setProperty('--fs', m + 'px'); if (ok()) lo = m; else hi = m; }
  el.style.setProperty('--fs', lo + 'px');
}
function show(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  const full = s.t === 'title' || s.t === 'div';
  canvas.innerHTML = full ? R[s.t](s) : `<div class="slide">${R[s.t](s)}<div class="footer"><span><b>Analiza i opis pracy</b> · dr Marcin Żółtak · ZMIANOLOGICA · MERITO</span><span>${cur + 1} / ${SLIDES.length}</span></div></div>`;
  canvas.querySelectorAll('.fit').forEach(el => { if (el.classList.contains('body')) fit(el); });
  document.getElementById('cnt').textContent = (cur + 1) + ' / ' + SLIDES.length;
  if (location.hash !== '#' + (cur + 1)) history.replaceState(null, '', '#' + (cur + 1));
}
function scale() {
  const st = document.getElementById('stage');
  const k = Math.min(st.clientWidth / 1280, st.clientHeight / 720);
  canvas.style.transform = `scale(${k})`;
}
document.getElementById('prev').onclick = () => show(cur - 1);
document.getElementById('next').onclick = () => show(cur + 1);
document.getElementById('fs').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
const toc = document.getElementById('toc');
document.getElementById('tocb').onclick = () => { toc.hidden = !toc.hidden; };
document.getElementById('tocin').innerHTML = SLIDES.map((s, i) => s.t === 'div' ? `<button type="button" data-i="${i}"><b>${s.n}</b>${esc(s.h)}</button>` : '').join('');
toc.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { show(+b.dataset.i); toc.hidden = true; } });
document.addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  if (e.key === 'Home') show(0); if (e.key === 'End') show(SLIDES.length - 1);
  if (e.key === 'Escape') toc.hidden = true;
});
window.addEventListener('resize', scale);
scale();
show((parseInt(location.hash.slice(1)) || 1) - 1);
if (document.fonts) document.fonts.ready.then(() => show(cur));

</script>
</body>
</html>
